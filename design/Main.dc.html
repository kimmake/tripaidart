<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Trip Dart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#DCE7EC}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
@keyframes wobble{0%{transform:translate(-3px,-41px) rotate(0deg) scale(1.08,.9)}15%{transform:translate(-3px,-41px) rotate(-9deg)}35%{transform:translate(-3px,-41px) rotate(6deg)}55%{transform:translate(-3px,-41px) rotate(-3.5deg)}75%{transform:translate(-3px,-41px) rotate(1.5deg)}100%{transform:translate(-3px,-41px) rotate(0deg)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,3px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,1px)}80%{transform:translate(1px,-1px)}}
@keyframes burst{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes ripple{0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes popIn{0%{transform:scale(.7) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.dart-land{animation:wobble .65s ease-out forwards}
.shake{animation:shake .3s ease-out}
.burst{animation:burst .5s ease-out forwards}
.ripple{animation:ripple .9s ease-out forwards}
.backdrop{animation:fadeIn .3s ease-out .75s both}
.pop{animation:popIn .45s cubic-bezier(.2,1.3,.4,1) .75s both}
.hint{animation:fadeIn .4s ease-out both}
.map-btn{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.map-btn:focus-visible{outline:3px solid #E4572E;outline-offset:4px}
.throw-btn:hover{background:#C9431E}
.go-btn:hover{background:#0F2440}
.ghost-btn:hover{background:#EEF2F3}
.region-label{font-family:'Noto Sans KR',system-ui,sans-serif;font-size:8.5px;font-weight:500;fill:#2B3640;paint-order:stroke;stroke:#FFFFFF;stroke-width:2px;stroke-linejoin:round;pointer-events:none}
@media (prefers-reduced-motion: reduce){.dart-land,.ripple,.burst,.shake,.pop,.backdrop,.hint{animation-duration:1ms;animation-delay:0s}}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; box-sizing: border-box; padding: 24px 16px; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #16202A; background: #DCE7EC; display: flex; align-items: center; justify-content: center">

<main class="{{mainClass}}" style="position: relative; width: 100%; max-width: 880px">
<button class="map-btn" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{cancel}}" onClick="{{keyThrow}}" onContextMenu="{{noMenu}}" aria-label="지도를 누르고 있다가 놓으면 그 방향으로 다트 던지기" style="display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; cursor: crosshair; border-radius: 12px">
<svg viewBox="{{viewBox}}" style="display: block; width: 100%; height: auto" role="img" aria-label="대한민국 시·군 경계 지도">
<rect x="0" y="0" width="{{mapW}}" height="{{mapH}}" fill="#DCE7EC"></rect>
<sc-for list="{{regions}}" as="r" hint-placeholder-count="0">
<path d="{{r.d}}" fill="{{r.fill}}" stroke="#A9B1B6" stroke-width="0.7" stroke-linejoin="round"></path>
</sc-for>
<path d="{{provD}}" fill="none" stroke="#1D2329" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></path>
<sc-if value="{{hasHit}}" hint-placeholder-val="{{ false }}">
<path d="{{hit.d}}" fill="none" stroke="#A63A17" stroke-width="2.4" stroke-linejoin="round"></path>
</sc-if>
<sc-for list="{{labels}}" as="l" hint-placeholder-count="0">
<text class="region-label" x="{{l.x}}" y="{{l.y}}" text-anchor="middle" dominant-baseline="middle">{{l.s}}</text>
</sc-for>
<sc-if value="{{showDrop}}" hint-placeholder-val="{{ false }}">
<line x1="{{aimPt.x}}" y1="{{aimPt.y}}" x2="{{landPt.x}}" y2="{{landPt.y}}" stroke="#1F3A5F" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"></line>
</sc-if>
<sc-if value="{{showAim}}" hint-placeholder-val="{{ false }}">
<g>
<circle cx="{{aimPt.x}}" cy="{{aimPt.y}}" r="8" fill="none" stroke="#1F3A5F" stroke-width="2"></circle>
<circle cx="{{aimPt.x}}" cy="{{aimPt.y}}" r="1.8" fill="#1F3A5F"></circle>
</g>
</sc-if>
</svg>
</button>

<sc-if value="{{loading}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #3B4F63">지도를 불러오는 중…</div>
</sc-if>

<sc-if value="{{showHint}}" hint-placeholder-val="{{ true }}">
<p class="hint" style="position: absolute; left: 50%; top: 8px; transform: translateX(-50%); margin: 0; padding: 10px 18px; border-radius: 999px; background: #FFFFFF; color: #2B3640; font-size: 14px; font-weight: 500; white-space: nowrap; box-shadow: 0 4px 14px rgba(22,32,42,0.12); pointer-events: none">지도를 꾹 눌러 힘을 모으고, 놓으면 던져요</p>
</sc-if>

<sc-if value="{{charging}}" hint-placeholder-val="{{ false }}">
<div ref="{{gaugeRef}}" aria-hidden="true" style="position: absolute; left: {{aimPos.left}}; top: {{aimPos.top}}; width: 0; height: 0; pointer-events: none">
<div style="position: absolute; left: -36px; top: -36px; width: 72px; height: 72px">
<svg width="72" height="72" viewBox="0 0 72 72" fill="none">
<circle cx="36" cy="36" r="26" stroke="#FFFFFF" stroke-width="8" opacity="0.85"></circle>
<circle ref="{{ringRef}}" cx="36" cy="36" r="26" stroke="#E4572E" stroke-width="8" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 36 36)"></circle>
<circle cx="10.5" cy="40.9" r="4" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="1.5"></circle>
<circle cx="36" cy="36" r="3" fill="#1F3A5F"></circle>
</svg>
</div>
<p style="position: absolute; left: 0; top: 42px; transform: translateX(-50%); margin: 0; padding: 4px 10px; border-radius: 999px; background: #1F3A5F; color: #FFFFFF; font-size: 12px; font-weight: 700; white-space: nowrap">놓으면 던져요</p>
</div>
</sc-if>

<sc-if value="{{showFly}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<div ref="{{shadowRef}}" style="position: absolute; left: {{landPos.left}}; top: {{landPos.top}}; width: 34px; height: 12px; margin: -6px 0 0 -17px; border-radius: 50%; background: rgba(16,24,32,0.6); filter: blur(2px); opacity: 0"></div>
<div ref="{{flyRef}}" style="position: absolute; left: {{flyStart.left}}; top: {{flyStart.top}}; width: 0; height: 0">
<div ref="{{bodyRef}}" style="width: 44px; height: 44px; transform-origin: 3px 41px; transform: translate(-3px,-41px) scale(3.2); opacity: 0">
<svg width="44" height="44" viewBox="0 0 44 44" fill="none"><path d="M3 41 L16 28" stroke="#3B4650" stroke-width="2.5" stroke-linecap="round"></path><path d="M14 30 L27 17" stroke="#1F3A5F" stroke-width="6" stroke-linecap="round"></path><path d="M27 17 L35 4 L36 15 Z M27 17 L40 9 L29 8 Z" fill="#E4572E" stroke="#A63A17" stroke-width="1.2" stroke-linejoin="round"></path></svg>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{showLand}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; left: {{landPos.left}}; top: {{landPos.top}}; width: 0; height: 0; pointer-events: none">
<div class="ripple" style="position: absolute; left: 0; top: 0; width: 70px; height: 70px; border-radius: 50%; border: 3px solid #E4572E"></div>
<div class="burst" style="position: absolute; left: -30px; top: -30px; width: 60px; height: 60px">
<svg width="60" height="60" viewBox="0 0 60 60" fill="none"><path d="M44 30H54M37 42.1L42 50.8M23 42.1L18 50.8M16 30H6M23 17.9L18 9.2M37 17.9L42 9.2" stroke="#A63A17" stroke-width="2.5" stroke-linecap="round"></path></svg>
</div>
<div style="position: absolute; left: -12px; top: -2px; width: 24px; height: 8px; border-radius: 50%; background: rgba(16,24,32,0.3); filter: blur(1.5px)"></div>
<div style="position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #A63A17; border: 2px solid #FFFFFF"></div>
<div class="dart-land" style="width: 44px; height: 44px; transform-origin: 3px 41px">
<svg width="44" height="44" viewBox="0 0 44 44" fill="none"><path d="M3 41 L16 28" stroke="#3B4650" stroke-width="2.5" stroke-linecap="round"></path><path d="M14 30 L27 17" stroke="#1F3A5F" stroke-width="6" stroke-linecap="round"></path><path d="M27 17 L35 4 L36 15 Z M27 17 L40 9 L29 8 Z" fill="#E4572E" stroke="#A63A17" stroke-width="1.2" stroke-linejoin="round"></path></svg>
</div>
</div>
</sc-if>
</main>

<sc-if value="{{showResult}}" hint-placeholder-val="{{ false }}">
<div class="backdrop" style="position: absolute; inset: 0; background: rgba(16,24,32,0.45); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<div class="pop" role="dialog" aria-label="다트가 꽂힌 곳" aria-live="polite" style="position: relative; width: 100%; max-width: 380px; background: #FFFFFF; border-radius: 24px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 60px rgba(16,24,32,0.3)">
<button class="ghost-btn" onClick="{{close}}" aria-label="결과 닫기" style="position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: #3B4650; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
</button>

<sc-if value="{{hasHit}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="height: 240px; border-radius: 16px; background: #FBF4EF; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box">
<svg viewBox="{{hit.vb}}" style="width: 100%; height: 100%; overflow: visible" role="img" aria-label="{{hit.title}} 지역 모양">
<path d="{{hit.d}}" fill="#000000" opacity="0.12" transform="{{hit.shadow}}"></path>
<path d="{{hit.d}}" fill="#E4572E" stroke="#A63A17" stroke-width="{{hit.sw}}" stroke-linejoin="round"></path>
</svg>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; text-align: center">
<p style="margin: 0; font-size: 14px; color: #5B6772">{{hit.sub}}</p>
<h2 style="margin: 0; font-size: 34px; line-height: 1.2; font-weight: 900; letter-spacing: -0.02em">{{hit.title}}</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #5B6772">{{shotInfo}}</p>
</div>
<a class="go-btn" href="https://triponline-topaz.vercel.app/" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 14px; background: #1F3A5F; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none">
<span>triponline</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>
</a>
</div>
</sc-if>

<sc-if value="{{isSea}}" hint-placeholder-val="{{ false }}">
<div style="height: 200px; border-radius: 16px; background: #DCE7EC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 16px; box-sizing: border-box">
<p style="margin: 0; font-size: 18px; font-weight: 700; color: #1F3A5F">육지를 벗어났어요. 다시 던져 보세요.</p>
<p style="margin: 0; font-size: 13px; color: #3B4F63">{{shotInfo}}</p>
</div>
</sc-if>

<button class="ghost-btn" onClick="{{close}}" style="height: 48px; border: 1px solid #C3CCD2; border-radius: 14px; background: #FFFFFF; color: #2B3640; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer">다시 던지기</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"landOnly":{"editor":"boolean","default":true},"showNames":{"editor":"boolean","default":true},"gravity":{"editor":"range","default":230,"min":0,"max":500,"step":10},"$preview":{"width":1280,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { data: null, phase: 'idle', aim: null, land: null, power: 0, hitIndex: -1 };
    this.paths = null;
    this.ctx = null;
    this.raf = 0;
    this.charge = null;
    this.el = {};
    this.SWEET = 0.72;
    this.FLIGHT_MS = 900;
    this.cb = {
      gauge: (e) => { this.el.gauge = e; },
      ring: (e) => { this.el.ring = e; },
      fly: (e) => { this.el.fly = e; },
      body: (e) => { this.el.body = e; },
      shadow: (e) => { this.el.shadow = e; }
    };
  }
  componentDidMount() {
    fetch('/_blob/a2c4e1fdc116c897ea4b007e4dc3ac7e')
      .then((r) => r.json())
      .then((data) => {
        this.paths = data.regions.map((r) => new Path2D(r.d));
        this.ctx = document.createElement('canvas').getContext('2d');
        this.setState({ data: data });
      })
      .catch(() => {});
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  regionAt(x, y) {
    if (!this.paths) return -1;
    for (let i = 0; i < this.paths.length; i++) {
      if (this.ctx.isPointInPath(this.paths[i], x, y, 'evenodd')) return i;
    }
    return -1;
  }
  gravity() { return this.props.gravity ?? 230; }
  pct(v, total) { return (v / total * 100) + '%'; }
  toMap(e, rect) {
    const d = this.state.data;
    return { x: (e.clientX - rect.left) / rect.width * d.w, y: (e.clientY - rect.top) / rect.height * d.h };
  }
  power() {
    const t = (performance.now() - this.charge.start) / 1400;
    return (1 - Math.cos(t * 2 * Math.PI)) / 2;
  }
  chargeLoop() {
    if (!this.charge) return;
    if (this.el.ring) this.el.ring.style.strokeDashoffset = String(163.4 * (1 - this.power()));
    this.raf = requestAnimationFrame(() => this.chargeLoop());
  }
  // 힘 p(0~1)로 aim을 향해 던졌을 때 실제로 꽂히는 곳: 힘이 모자라면 중력만큼 아래로, 넘치면 위로
  landFor(aim, p) {
    const drop = (this.SWEET - p) * this.gravity();
    const r = (4 + 14 * p) * Math.sqrt(Math.random());
    const a = Math.random() * Math.PI * 2;
    return { x: aim.x + Math.cos(a) * r, y: aim.y + drop + Math.sin(a) * r * 0.6 };
  }
  launch(aim, land, p) {
    const d = this.state.data;
    cancelAnimationFrame(this.raf);
    this.setState({ phase: 'fly', aim: aim, land: land, power: p, hitIndex: -1 }, () => {
      const start = performance.now();
      const S = { x: land.x + 150, y: d.h + 260 };
      const pos = (t) => ({
        x: S.x + (aim.x - S.x) * t + (land.x - aim.x) * t * t,
        y: S.y + (aim.y - S.y) * t + (land.y - aim.y) * t * t - 70 * Math.sin(Math.PI * t)
      });
      const step = () => {
        const t = Math.min(1, (performance.now() - start) / this.FLIGHT_MS);
        const q = pos(t);
        if (this.el.fly) {
          this.el.fly.style.left = this.pct(q.x, d.w);
          this.el.fly.style.top = this.pct(q.y, d.h);
        }
        if (this.el.body) {
          const s = 1 + 2.2 * Math.pow(1 - t, 1.5);
          const rot = -30 * (1 - t);
          this.el.body.style.transform = 'translate(-3px,-41px) rotate(' + rot.toFixed(1) + 'deg) scale(' + s.toFixed(3) + ')';
          this.el.body.style.opacity = String(Math.min(1, t * 6));
          this.el.body.style.filter = 'blur(' + (1.6 * (1 - t)).toFixed(2) + 'px)';
        }
        if (this.el.shadow) {
          const k = 1 - t;
          this.el.shadow.style.transform = 'translate(' + (90 * k).toFixed(1) + 'px,' + (50 * k).toFixed(1) + 'px) scale(' + (1 + 1.6 * k).toFixed(2) + ')';
          this.el.shadow.style.opacity = String((0.4 * t).toFixed(2));
        }
        if (t < 1) { this.raf = requestAnimationFrame(step); return; }
        const i = (land.x >= 0 && land.y >= 0 && land.x <= d.w && land.y <= d.h) ? this.regionAt(land.x, land.y) : -1;
        this.setState({ phase: i >= 0 ? 'hit' : 'sea', hitIndex: i });
      };
      this.raf = requestAnimationFrame(step);
    });
  }
  isMetro(r) { return !/[시군]$/.test(r.n); }
  titleOf(r) { return this.isMetro(r) ? r.p : r.n; }
  renderVals() {
    const data = this.state.data;
    const phase = this.state.phase;
    const landOnly = this.props.landOnly ?? true;
    const showNames = this.props.showNames ?? true;
    const w = data ? data.w : 890;
    const h = data ? data.h : 947;
    const hitIndex = this.state.hitIndex;
    const regions = data ? data.regions.map((r, i) => ({ d: r.d, fill: i === hitIndex ? '#E4572E' : '#FFFFFF' })) : [];
    const labels = data && showNames ? data.regions.map((r) => ({ x: r.c[0], y: r.c[1], s: r.s })) : [];
    let hit = null;
    if (data && hitIndex >= 0) {
      const r = data.regions[hitIndex];
      const bw = r.b[2] - r.b[0], bh = r.b[3] - r.b[1];
      const size = Math.max(bw, bh);
      const pad = size * 0.08;
      hit = {
        d: r.d,
        vb: (r.b[0] - pad) + ' ' + (r.b[1] - pad) + ' ' + (bw + pad * 2) + ' ' + (bh + pad * 2),
        sw: (size / 160).toFixed(2),
        shadow: 'translate(' + (size * 0.012).toFixed(2) + ' ' + (size * 0.02).toFixed(2) + ')',
        title: this.titleOf(r),
        sub: this.isMetro(r) ? '대한민국' : r.p
      };
    }
    const aim = this.state.aim, land = this.state.land;
    const landed = phase === 'hit' || phase === 'sea' || phase === 'closed';
    // 지도 좌표 1단위 = 위도 1/170도 ≈ 0.653km
    let shotInfo = '';
    if (aim && land) {
      const km = Math.round(Math.hypot(land.x - aim.x, land.y - aim.y) * 111 / 170);
      shotInfo = '힘 ' + Math.round(this.state.power * 100) + '% · 겨냥한 곳에서 약 ' + km + 'km ' + (land.y >= aim.y ? '아래로 떨어졌어요' : '위로 넘어갔어요');
    }
    const clampPos = (p) => p ? { left: this.pct(Math.max(0, Math.min(w, p.x)), w), top: this.pct(Math.max(0, Math.min(h, p.y)), h) } : { left: '0%', top: '0%' };
    return {
      viewBox: '0 0 ' + w + ' ' + h,
      mainClass: phase === 'hit' || phase === 'sea' ? 'shake' : '',
      mapW: w,
      mapH: h,
      regions: regions,
      labels: labels,
      provD: data ? data.prov : '',
      loading: !data,
      showHint: !!data && phase === 'idle',
      charging: phase === 'charge',
      showFly: phase === 'fly',
      showLand: landed && !!land,
      showAim: (phase === 'fly' || landed) && !!aim,
      showDrop: landed && !!aim && !!land,
      showResult: phase === 'hit' || phase === 'sea',
      isSea: phase === 'sea',
      hasHit: !!hit,
      hit: hit || { d: '', vb: '0 0 1 1', sw: '1', shadow: '', title: '', sub: '' },
      shotInfo: shotInfo,
      aimPt: aim || { x: 0, y: 0 },
      landPt: land ? { x: Math.max(0, Math.min(w, land.x)), y: Math.max(0, Math.min(h, land.y)) } : { x: 0, y: 0 },
      aimPos: clampPos(aim),
      landPos: clampPos(land),
      flyStart: { left: '120%', top: '140%' },
      gaugeRef: this.cb.gauge,
      ringRef: this.cb.ring,
      flyRef: this.cb.fly,
      bodyRef: this.cb.body,
      shadowRef: this.cb.shadow,
      noMenu: (e) => e.preventDefault(),
      down: (e) => {
        if (!data || phase === 'fly' || e.button > 0) return;
        e.preventDefault();
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        const rect = e.currentTarget.getBoundingClientRect();
        const a = this.toMap(e, rect);
        this.charge = { start: performance.now(), rect: rect, aim: a };
        cancelAnimationFrame(this.raf);
        this.setState({ phase: 'charge', aim: a, land: null, hitIndex: -1 }, () => this.chargeLoop());
      },
      move: (e) => {
        if (!this.charge) return;
        const a = this.toMap(e, this.charge.rect);
        this.charge.aim = a;
        if (this.el.gauge) {
          this.el.gauge.style.left = this.pct(a.x, w);
          this.el.gauge.style.top = this.pct(a.y, h);
        }
      },
      up: () => {
        if (!this.charge) return;
        const p = this.power();
        const a = this.charge.aim;
        this.charge = null;
        this.launch(a, this.landFor(a, p), p);
      },
      cancel: () => {
        if (!this.charge) return;
        this.charge = null;
        cancelAnimationFrame(this.raf);
        this.setState({ phase: 'idle', aim: null });
      },
      keyThrow: (e) => {
        if (!data || e.detail !== 0 || phase === 'fly') return;
        const a = { x: w / 2, y: h / 2 };
        const p = 0.55 + Math.random() * 0.35;
        this.launch(a, this.landFor(a, p), p);
      },
      throwRandom: () => {
        if (!data || phase === 'fly') return;
        const p = 0.4 + Math.random() * 0.55;
        let land = null;
        for (let k = 0; k < 600; k++) {
          land = { x: Math.random() * w, y: Math.random() * h };
          if (!landOnly || this.regionAt(land.x, land.y) >= 0) break;
        }
        const aim = { x: land.x + (Math.random() - 0.5) * 16, y: Math.max(6, land.y - (this.SWEET - p) * this.gravity()) };
        this.launch(aim, land, p);
      },
      close: () => this.setState({ phase: 'closed' })
    };
  }
}
</script>
