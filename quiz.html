<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성향별 여행지 찾기</title>
<meta name="description" content="간단한 성향 검사로 나의 여행 성향을 알아보고, 성향에 맞는 국내·해외 여행지를 추천합니다.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=IBM+Plex+Sans+KR:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#000;}
body{-webkit-font-smoothing:antialiased;}
* { box-sizing: border-box; }
a{color:#dceaff;}a:hover{color:#fff;}
button{font:inherit;}
::selection{background:rgba(190,225,255,.25);}

@keyframes tai-in{from{opacity:0;filter:blur(14px);transform:translateY(14px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes tai-in-soft{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}
@keyframes tai-runway{0%{opacity:.15}50%{opacity:.55}100%{opacity:.15}}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.tai-hint-btn:hover{color:#fff}
.tai-map-btn:hover{border-color:rgba(215,238,255,.8);background:rgba(190,225,255,.1);box-shadow:0 0 34px rgba(150,200,255,.28)}
.tai-back-btn:hover{color:rgba(255,255,255,.7)}

/* image slot: production-only version of the design's user-fillable placeholder —
   a static striped placeholder that crossfades into the fetched photo */
.tai-image-slot{position:relative;overflow:hidden;background:#0a0a0a}
.tai-slot-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);color:rgba(255,255,255,.35);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;transition:opacity 500ms ease;}
.tai-slot-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 900ms ease;}
.tai-slot-img.is-loaded{opacity:1}
.tai-image-slot.has-image .tai-slot-placeholder{opacity:0}
.tai-slot-credit{position:absolute;left:10px;bottom:10px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;color:rgba(255,255,255,.55);text-decoration:none;opacity:0;transition:opacity 300ms ease;z-index:2}
.tai-slot-credit.is-visible{opacity:1}

/* quiz option rows (state driven from JS, transitions defined here) */
.tai-option{appearance:none;text-align:left;cursor:pointer;border:0;border-top:1px solid rgba(255,255,255,.1);padding:20px 8px 20px 4px;min-height:60px;display:flex;align-items:baseline;gap:18px;width:100%;transform-origin:left center;transition:all 420ms cubic-bezier(.3,0,.2,1);background:transparent;font-family:inherit;}
.tai-option-num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;color:rgba(190,225,255,.55);flex:none}
.tai-option-label{font-weight:300;font-size:clamp(16.5px,4.4vw,23px);line-height:1.35;letter-spacing:-.01em;flex:1}
.tai-kw-grid{display:grid!important;grid-template-columns:repeat(3,1fr);gap:10px!important}
.tai-kw-grid .tai-option{border:1px solid rgba(190,225,255,.18);border-radius:14px;padding:18px 6px;min-height:72px;justify-content:center;align-items:center;text-align:center;transform-origin:center}
.tai-kw-grid .tai-option-num,.tai-kw-grid .tai-option-arrow{display:none}
.tai-kw-grid .tai-option-label{flex:none;font-size:clamp(14.5px,3.9vw,18px);word-break:keep-all}
.tai-option-arrow{font-family:'IBM Plex Mono',monospace;font-size:13px;flex:none;transition:opacity 400ms ease;color:var(--ice,#cfe6ff)}

/* result: alternates */
.tai-alt-card{display:flex;flex-direction:column;gap:14px}
.tai-alt-imgwrap{width:100%;aspect-ratio:4/5;background:#060606}
.tai-alt-city{font-family:'Space Grotesk',sans-serif;font-weight:400;font-size:clamp(20px,5vw,27px);letter-spacing:-.02em;color:#fff}
.tai-alt-meta{margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.4)}
.tai-alt-tagline{margin-top:10px;font-weight:200;font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.55)}

.tai-reason{display:flex;align-items:baseline;gap:18px;padding:22px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.tai-reason-num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ice,#cfe6ff);opacity:.6;flex:none}
.tai-reason-text{font-weight:200;font-size:clamp(16px,4.3vw,22px);line-height:1.45;color:rgba(255,255,255,.88);text-wrap:pretty}
</style>
</head>
<body>
<div id="root" style="--ice:#cfe6ff;position:fixed;inset:0;background:#000;color:#fff;font-family:'IBM Plex Sans KR','Space Grotesk',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none">

  <div style="position:absolute;inset:0;pointer-events:none;z-index:6;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.85) 100%)"></div>
  <div id="moodLayer" style="position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 900ms ease"></div>

  <div id="logo" style="position:absolute;left:50%;z-index:8;pointer-events:none;top:46%;transform:translate(-50%,-50%) scale(1);opacity:0;transition:top 1400ms cubic-bezier(.2,.7,.15,1),transform 1400ms cubic-bezier(.2,.7,.15,1),opacity 1200ms ease">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:400;font-size:clamp(46px,11vw,104px);letter-spacing:.02em;line-height:1;color:#fff;text-shadow:0 0 14px rgba(205,232,255,.55),0 0 46px rgba(150,200,255,.35),0 0 110px rgba(110,170,255,.22);white-space:nowrap">Trip<span style="font-weight:300;color:var(--ice,#cfe6ff)">AI</span></div>
  </div>

  <div id="phaseIntro" class="tai-phase" style="position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0">
    <div style="height:clamp(120px,22vh,200px)"></div>
    <div id="tagline" style="opacity:0;transition:opacity 1600ms ease,filter 1600ms ease;filter:blur(10px);text-align:center">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:300;font-size:clamp(13px,3.4vw,19px);letter-spacing:.42em;text-transform:uppercase;color:rgba(225,240,255,.82)">Where will you go next?</div>
      <div style="margin-top:18px;font-weight:200;font-size:clamp(12px,3.1vw,15px);letter-spacing:.18em;color:rgba(255,255,255,.4)">여행, 당신에게 더 가까워지다.</div>
    </div>
    <div id="hintWrap" style="position:absolute;bottom:38px;left:0;right:0;display:flex;justify-content:center;opacity:0;transition:opacity 1200ms ease">
      <button id="beginBtn" class="tai-hint-btn" style="appearance:none;background:transparent;border:0;padding:12px 16px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.42)">Scroll / tap to begin</button>
    </div>
  </div>

  <div id="phaseMap" class="tai-phase" style="position:absolute;inset:0;z-index:4;display:none;flex-direction:column">
    <div id="heroMap" style="position:absolute;left:0;right:0;top:0;bottom:0;transform:scale(1) translateY(0%);opacity:1;transition:transform 1300ms cubic-bezier(.4,0,.2,1),opacity 1100ms ease;will-change:transform,opacity"></div>
    <div id="mapUi" style="position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding:0 22px 42px;background:linear-gradient(to top,rgba(0,0,0,.92) 10%,rgba(0,0,0,0) 100%);opacity:1;transition:opacity 800ms ease">
      <div id="mapQ" style="font-weight:200;font-size:clamp(19px,5.6vw,32px);letter-spacing:-.01em;color:rgba(255,255,255,.94);text-align:center">어디로 떠나고 싶나요?</div>
      <button id="startQuizBtn" class="tai-map-btn" style="margin-top:30px;position:relative;overflow:hidden;appearance:none;cursor:pointer;background:rgba(190,225,255,.04);border:1px solid rgba(190,225,255,.32);border-radius:999px;padding:16px 30px;min-height:52px;white-space:nowrap;color:#fff;font-family:'IBM Plex Sans KR',sans-serif;font-weight:300;font-size:15px;letter-spacing:.04em;transition:box-shadow 500ms ease,border-color 500ms ease,background 500ms ease">나에게 맞는 여행지 찾기 →</button>
    </div>
  </div>

  <div id="phaseQuiz" class="tai-phase" style="position:absolute;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;padding:clamp(74px,13vh,140px) 22px 28px;box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch">
    <div style="width:100%;max-width:560px;display:flex;align-items:center;gap:14px">
      <div style="flex:1;height:1px;background:rgba(255,255,255,.12);position:relative">
        <div id="progressFill" style="position:absolute;left:0;top:0;height:1px;width:0%;background:linear-gradient(90deg,rgba(190,225,255,.35),#eaf6ff);box-shadow:0 0 10px rgba(170,215,255,.7);transition:width 700ms cubic-bezier(.4,0,.2,1)"></div>
      </div>
      <div id="progressLabel" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:rgba(255,255,255,.45)"></div>
    </div>

    <div style="width:100%;max-width:720px;margin-top:clamp(28px,7vh,74px);flex:0 0 auto;display:flex;flex-direction:column;justify-content:center">
      <div id="qBlock" style="animation:tai-in 900ms both">
        <div id="qKicker" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.3em;color:var(--ice,#cfe6ff);opacity:.7"></div>
        <div id="qTitle" style="margin-top:16px;font-weight:200;font-size:clamp(23px,6.4vw,40px);line-height:1.28;letter-spacing:-.015em;color:#fff;text-wrap:pretty"></div>
        <div id="optionsList" style="margin-top:clamp(26px,5vh,44px);display:flex;flex-direction:column;gap:2px"></div>
      </div>
    </div>
    <button id="backBtn" class="tai-back-btn" style="appearance:none;background:transparent;border:0;cursor:pointer;margin-top:28px;padding:12px;flex:none;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.28);opacity:0">← back</button>
  </div>

  <div id="phaseAnalyze" class="tai-phase" style="position:absolute;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center">
    <div id="analyzeMap" style="position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);height:min(62vh,520px);opacity:.9"></div>
    <div style="position:absolute;left:0;right:0;bottom:clamp(60px,14vh,120px);display:flex;flex-direction:column;align-items:center;gap:0;padding:0 24px">
      <div id="analyzeMsg" style="animation:tai-in-soft 900ms both;font-weight:200;font-size:clamp(17px,4.8vw,26px);letter-spacing:-.01em;color:#fff;text-align:center;text-shadow:0 0 30px rgba(0,0,0,.9)"></div>
      <div style="margin-top:26px;width:min(220px,46vw);height:1px;background:rgba(255,255,255,.12);position:relative">
        <div id="analyzeFill" style="position:absolute;inset:0 auto 0 0;width:0%;background:#eaf6ff;box-shadow:0 0 10px rgba(170,215,255,.8);transition:width 1400ms linear"></div>
      </div>
    </div>
  </div>

  <div id="phaseResult" class="tai-phase" style="position:absolute;inset:0;z-index:7;display:none;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch">

    <section style="position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(90px,16vh,150px) clamp(20px,5vw,64px) clamp(44px,8vh,76px);box-sizing:border-box">
      <div id="heroImgOuter" style="position:absolute;inset:0;z-index:0;animation:tai-in-soft 2600ms 700ms both">
        <div id="heroSlot" class="tai-image-slot" style="position:absolute;inset:0">
          <div id="heroSlotPlaceholder" class="tai-slot-placeholder"><span id="heroSlotHint"></span></div>
          <img id="heroImg" class="tai-slot-img" alt="">
          <a id="heroCredit" class="tai-slot-credit" target="_blank" rel="noopener"></a>
        </div>
      </div>
      <div style="position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.9) 6%,rgba(0,0,0,.74) 45%,rgba(0,0,0,.5) 100%)"></div>
      <div style="position:relative;z-index:2">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.3em;color:var(--ice,#cfe6ff);animation:tai-in-soft 1200ms both">YOUR DESTINATION</div>
        <h1 id="cityUpper" style="margin:10px 0 0;font-family:'Space Grotesk',sans-serif;font-weight:400;font-size:clamp(42px,12vw,120px);line-height:.94;letter-spacing:-.03em;color:#fff;text-shadow:0 0 60px rgba(120,180,255,.22);animation:tai-in 1500ms 150ms both"></h1>
        <div style="margin-top:22px;max-width:620px;font-weight:200;font-size:clamp(15px,4.2vw,21px);line-height:1.6;color:rgba(255,255,255,.9);animation:tai-in 1400ms 900ms both">당신에게 가장 어울리는 여행지는<br><span id="cityCountry" style="color:#fff;font-weight:300"></span> 입니다.</div>
        <div style="margin-top:30px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;animation:tai-in 1400ms 1200ms both">
          <div style="display:flex;align-items:baseline;gap:8px"><span id="matchPct" style="font-family:'Space Grotesk',sans-serif;font-weight:400;font-size:clamp(26px,7vw,40px);letter-spacing:-.02em;color:var(--ice,#cfe6ff);text-shadow:0 0 24px rgba(150,200,255,.45)"></span><span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.26em;color:rgba(255,255,255,.5)">취향 매칭</span></div>
          <div id="destTagline" style="font-weight:200;font-size:13px;color:rgba(255,255,255,.38)"></div>
        </div>
      </div>
    </section>

    <section style="padding:clamp(50px,10vh,96px) clamp(20px,5vw,64px);border-top:1px solid rgba(255,255,255,.08)">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.3em;color:rgba(255,255,255,.4)">YOUR TYPE</div>
      <div style="margin-top:22px">
        <div id="typeName" style="font-weight:300;font-size:clamp(26px,7vw,40px);color:#fff;text-shadow:0 0 30px rgba(150,200,255,.25)"></div>
        <div id="typeDesc" style="margin-top:8px;font-weight:200;font-size:15px;color:rgba(255,255,255,.6)"></div>
      </div>
      <div id="typeChart" role="img" style="margin-top:40px;max-width:420px;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,4vw,28px);align-items:end"></div>
      <div style="margin-top:56px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.3em;color:rgba(255,255,255,.4)">TRAVEL STYLE</div>
      <div id="reasonsList" style="margin-top:26px;display:flex;flex-direction:column;gap:0;max-width:760px"></div>
    </section>

    <section style="padding:clamp(40px,8vh,80px) clamp(20px,5vw,64px) clamp(56px,10vh,100px)">
      <div style="font-weight:200;font-size:clamp(18px,5vw,27px);color:rgba(255,255,255,.9)">그리고 이런 곳도 잘 맞아요.</div>
      <div id="altsGrid" style="margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(14px,2.5vw,26px)"></div>
    </section>

    <section style="position:relative;min-height:88svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(60px,12vh,110px) 22px;border-top:1px solid rgba(255,255,255,.08);overflow:hidden">
      <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,120vw);height:1px;background:linear-gradient(90deg,transparent,rgba(190,225,255,.5),transparent);animation:tai-runway 5s ease-in-out infinite"></div>
      <div style="position:relative;font-family:'Space Grotesk',sans-serif;font-weight:400;font-size:clamp(34px,9vw,62px);letter-spacing:.01em;color:#fff;text-shadow:0 0 18px rgba(205,232,255,.5),0 0 60px rgba(130,185,255,.28)">Trip<span style="font-weight:300;color:var(--ice,#cfe6ff)">AI</span></div>
      <div style="margin-top:34px;font-weight:200;font-size:clamp(17px,4.8vw,26px);line-height:1.6;color:rgba(255,255,255,.92)">여행지는 찾았습니다.<br>이제 여행을 알아볼 차례입니다.</div>
      <div id="ctaSub" style="margin-top:18px;font-weight:200;font-size:13.5px;line-height:1.7;color:rgba(255,255,255,.42)"></div>
      <a class="tai-map-btn" href="./" style="margin-top:40px;position:relative;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:rgba(190,225,255,.04);border:1px solid rgba(190,225,255,.32);border-radius:999px;padding:16px 30px;min-height:52px;white-space:nowrap;color:#fff;font-family:'IBM Plex Sans KR',sans-serif;font-weight:300;font-size:15px;letter-spacing:.04em;transition:box-shadow 500ms ease,border-color 500ms ease,background 500ms ease">다트 던지러 가기 →</a>
      <button id="restartBtn" class="tai-back-btn" style="margin-top:24px;appearance:none;background:transparent;border:0;cursor:pointer;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.3)">다시 해보기</button>
    </section>
  </div>
</div>

<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script>
(function () {
  'use strict';

  // Q1은 성별, Q2~Q10은 4지선다 간이 성향 문항, Q11~Q13은 키워드 선택입니다.
  // 각 선택지는 유형(type 1~9) 하나를 가리킵니다. Q2~Q10에서 유형마다 4번씩, 키워드 라운드에서 1번씩 등장합니다.
  // 정식 심리 검사가 아닌 재미용 간이 문항입니다.
  const QUESTIONS = [
    { kicker: 'Q1 / ABOUT YOU', title: '성별을 알려주세요.', options: [
      { label: '여성', mood: 'city', vec: {}, gender: 'f' },
      { label: '남성', mood: 'active', vec: {}, gender: 'm' },
      { label: '선택 안 함', mood: 'nature', vec: {}, gender: null } ] },
    { kicker: 'Q2 / PLAN', title: '여행 계획을 세울 때 나는?', options: [
      { label: '동선과 예약을 꼼꼼히 확인해 실수가 없게 해요', mood: 'city', vec: {}, type: 1 },
      { label: '짧은 시간에 최대한 많이 보도록 효율적으로 짜요', mood: 'city', vec: {}, type: 3 },
      { label: '그 지역의 역사와 정보를 깊이 공부해 둬요', mood: 'city', vec: {}, type: 5 },
      { label: '큰 틀은 내가 정하고 일행을 이끌어요', mood: 'active', vec: {}, type: 8 } ] },
    { kicker: 'Q3 / ATTRACTION', title: '여행지에서 가장 끌리는 건?', options: [
      { label: '현지 사람들과 정을 나누는 따뜻한 순간', mood: 'food', vec: {}, type: 2 },
      { label: '남들은 모르는 나만의 감성 스폿', mood: 'nature', vec: {}, type: 4 },
      { label: '후기가 많고 안전이 검증된 곳', mood: 'city', vec: {}, type: 6 },
      { label: '아무 생각 없이 쉴 수 있는 한적한 풍경', mood: 'nature', vec: {}, type: 9 } ] },
    { kicker: 'Q4 / FRIENDS', title: '친구들이 말하는 나는?', options: [
      { label: '뭐든 잘 해내는 능력자', mood: 'city', vec: {}, type: 3 },
      { label: '아는 게 많고 차분한 관찰자', mood: 'nature', vec: {}, type: 5 },
      { label: '분위기 메이커, 아이디어 뱅크', mood: 'active', vec: {}, type: 7 },
      { label: '바르고 책임감 강한 사람', mood: 'city', vec: {}, type: 1 } ] },

    Object.assign(state, patch);
    render();
  }

  // ---------- geography / d3 map drawing ----------

  function loadGeo() {
    const tick = (n) => {
      if (window.d3 && window.topojson) {
        window.d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
          .then((topo) => {
            geo = window.topojson.feature(topo, topo.objects.countries).features;
            if (state.phase === 'map') drawHero(els.heroMap);
            if (state.phase === 'analyze') drawAnalyze(els.analyzeMap);
          }).catch(() => {});
      } else if (n < 120) {
        setTimeout(() => tick(n + 1), 100);
      }
    };
    tick(0);
  }

  function projFor(el, pad) {
    const d3 = window.d3;
    const w = el.clientWidth || 900, h = el.clientHeight || 520;
    const proj = d3.geoNaturalEarth1();
    proj.fitExtent([[w * pad, h * (pad + .02)], [w * (1 - pad), h * (1 - pad - .02)]], { type: 'FeatureCollection', features: geo });
    return { w, h, proj, path: d3.geoPath(proj) };
  }

  function drawHero(el) {
    if (!el || !geo) return;
    const d3 = window.d3;
    el.innerHTML = '';
    const mob = (el.clientWidth || 900) < 640;
    let w, h, proj, path;
    if (mob) {
      w = el.clientWidth || 380; h = el.clientHeight || 600;
      proj = d3.geoNaturalEarth1();
      proj.fitExtent([[w * -0.06, h * 0.14], [w * 1.06, h * 0.66]], { type: 'FeatureCollection', features: geo });
      path = d3.geoPath(proj);
    } else {
      ({ w, h, proj, path } = projFor(el, .03));
    }
    const svg = d3.select(el).append('svg').attr('width', w).attr('height', h)
      .style('display', 'block').style('touch-action', 'pan-y');

    const label = document.createElement('div');
    label.style.cssText = "position:absolute;pointer-events:none;opacity:0;transition:opacity 260ms ease;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#eaf6ff;text-shadow:0 0 12px rgba(120,180,255,.8);white-space:nowrap;transform:translate(12px,-50%)";
    el.appendChild(label);

    const dotsG = svg.append('g').style('filter', 'drop-shadow(0 0 5px rgba(175,215,255,.9))');
    const lands = svg.append('g');

    const paths = lands.selectAll('path').data(geo).enter().append('path')
      .attr('d', path)
      .attr('fill', 'rgba(255,255,255,0.012)')
      .attr('stroke', 'rgba(190,225,255,0.3)')
      .attr('stroke-width', 0.6)
      .attr('stroke-linejoin', 'round')
      .style('cursor', 'crosshair');

    paths.each(function () { const L = this.getTotalLength() || 1; this.style.strokeDasharray = L; this.style.strokeDashoffset = L; });
    paths.transition().delay((d, i) => (rm ? 0 : 220 + (i % 34) * 26)).duration(rm ? 0 : 1500)
      .ease(d3.easeCubicOut).style('stroke-dashoffset', 0);

    const dots = CITY_DOTS.map((c) => {
      const p = proj([c[1], c[2]]);
      if (!p) return null;
      const node = dotsG.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 1.5)
        .attr('fill', '#e8f4ff').attr('opacity', 0);
      node.transition().delay(rm ? 0 : 120 + Math.random() * 900).duration(700).attr('opacity', .75);
      return { x: p[0], y: p[1], node };
    }).filter(Boolean);

    paths.on('mouseenter', function (e, d) {
      d3.select(this).interrupt().transition().duration(200)
        .attr('stroke', '#f2f9ff').attr('stroke-width', 1.15).attr('fill', 'rgba(190,225,255,0.055)');
      this.style.filter = 'drop-shadow(0 0 9px rgba(150,205,255,.75))';
      label.textContent = (d.properties && d.properties.name) || '';
      label.style.opacity = '1';
    }).on('mouseleave', function () {
      d3.select(this).interrupt().transition().duration(500)
        .attr('stroke', 'rgba(190,225,255,0.3)').attr('stroke-width', .6).attr('fill', 'rgba(255,255,255,0.012)');
      this.style.filter = 'none';
      label.style.opacity = '0';
    }).on('click', function (e, d) {
      label.textContent = (d.properties && d.properties.name) || '';
      label.style.opacity = '1';
      const r = el.getBoundingClientRect();
      label.style.left = (e.clientX - r.left) + 'px';
      label.style.top = (e.clientY - r.top) + 'px';
    });

    svg.on('mousemove', (e) => {
      const r = el.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      label.style.left = mx + 'px';
      label.style.top = my + 'px';
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        dots.forEach((d) => {
          const dist = Math.hypot(d.x - mx, d.y - my);
          const k = Math.max(0, 1 - dist / 190);
          d.node.attr('r', 1.5 + k * 2.4).attr('opacity', .62 + k * .38);
        });
      });
    });

    if (!rm) flightLines(svg, proj, path);
  }

  function flightLines(svg, proj, path) {
    const d3 = window.d3;
    const routes = [[[126.98, 37.57], [139.69, 35.69]], [[126.98, 37.57], [2.35, 48.86]], [[126.98, 37.57], [100.5, 13.75]], [[-74.01, 40.71], [-0.13, 51.51]]];
    const g = svg.append('g').style('pointer-events', 'none');
    const arcs = routes.map((r, i) => {
      const ip = d3.geoInterpolate(r[0], r[1]);
      const line = { type: 'LineString', coordinates: d3.range(0, 1.001, 1 / 48).map(ip) };
      const p = g.append('path').attr('d', path(line)).attr('fill', 'none')
        .attr('stroke', 'rgba(190,225,255,.22)').attr('stroke-width', .7);
      const L = p.node().getTotalLength() || 1;
      p.style('stroke-dasharray', L).style('stroke-dashoffset', L)
        .transition().delay(1500 + i * 400).duration(2000).ease(d3.easeCubicInOut).style('stroke-dashoffset', 0);
      const comet = g.append('circle').attr('r', 1.9).attr('fill', '#fff')
        .style('filter', 'drop-shadow(0 0 7px rgba(200,230,255,.95))').attr('opacity', 0);
      return { node: p.node(), L, comet, offset: i * 1.7 };
    });
    if (flightTimer) flightTimer.stop();
    flightTimer = d3.timer((t) => {
      const s = t / 1000;
      arcs.forEach((a) => {
        const u = ((s + a.offset) % 7) / 7;
        if (u > .92 || u < .02) { a.comet.attr('opacity', 0); return; }
        const pt = a.node.getPointAtLength(a.L * u);
        a.comet.attr('cx', pt.x).attr('cy', pt.y).attr('opacity', .9);
      });
    });
  }

  function drawAnalyze(el) {
    if (!el || !geo) return;
    const d3 = window.d3;
    el.innerHTML = '';
    const { w, h, proj, path } = projFor(el, .06);
    const svg = d3.select(el).append('svg').attr('width', w).attr('height', h).style('display', 'block');
    svg.append('g').selectAll('path').data(geo).enter().append('path')
      .attr('d', path).attr('fill', 'rgba(255,255,255,0.01)')
      .attr('stroke', 'rgba(190,225,255,0.17)').attr('stroke-width', .55).attr('opacity', 0)
      .transition().duration(rm ? 0 : 900).attr('opacity', 1);

    const g = svg.append('g');
    const targets = (ranked || DESTS.slice(0, 5)).slice(0, 5);
    const origin = [126.98, 37.57];
    const op = proj(origin);
    if (op) g.append('circle').attr('cx', op[0]).attr('cy', op[1]).attr('r', 2.2).attr('fill', '#fff')
      .style('filter', 'drop-shadow(0 0 8px rgba(200,230,255,.9))');

    targets.forEach((d, i) => {
      const ip = d3.geoInterpolate(origin, [d.lon, d.lat]);
      const line = { type: 'LineString', coordinates: d3.range(0, 1.001, 1 / 60).map(ip) };
      const p = g.append('path').attr('d', path(line)).attr('fill', 'none')
        .attr('stroke', i === 0 ? 'rgba(235,247,255,.95)' : 'rgba(190,225,255,.42)')
        .attr('stroke-width', i === 0 ? 1.1 : .75)
        .style('filter', 'drop-shadow(0 0 6px rgba(150,205,255,.55))');
      const L = p.node().getTotalLength() || 1;
      p.style('stroke-dasharray', L).style('stroke-dashoffset', L)
        .transition().delay(rm ? 0 : 260 + i * 520).duration(rm ? 0 : 1100).ease(d3.easeCubicInOut)
        .style('stroke-dashoffset', 0);
      const tp = proj([d.lon, d.lat]);
      if (!tp) return;
      g.append('circle').attr('cx', tp[0]).attr('cy', tp[1]).attr('r', i === 0 ? 3 : 2).attr('fill', '#eaf6ff')
        .style('filter', 'drop-shadow(0 0 9px rgba(180,220,255,.95))').attr('opacity', 0)
        .transition().delay(rm ? 0 : 1300 + i * 520).duration(500).attr('opacity', 1);
      g.append('text').attr('x', tp[0] + 7).attr('y', tp[1] + 3)
        .text(d.city.toUpperCase())
        .attr('fill', 'rgba(235,247,255,.8)')
        .style('font-family', "'IBM Plex Mono',monospace").style('font-size', '8.5px').style('letter-spacing', '.16em')
        .attr('opacity', 0).transition().delay(rm ? 0 : 1400 + i * 520).duration(600).attr('opacity', 1);
    });
  }

  // ---------- destination photos (live Wikipedia fetch) ----------

  function fetchImgs(dests) {
    dests.forEach((d) => {
      if (state.imgs[d.city]) return;
      const title = WIKI[d.city] || d.city;
      fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title))
        .then((res) => (res.ok ? res.json() : null))
        .then((j) => {
          const url = j && ((j.originalimage && j.originalimage.source) || (j.thumbnail && j.thumbnail.source));
          if (!url) return;
          const page = (j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) || '';
          state.imgs = Object.assign({}, state.imgs, { [d.city]: { url, page } });
          renderImages();
        }).catch(() => {});
    });
  }

  function setSlotImage(slot, img, creditEl, city) {
    const data = state.imgs[city];
    if (data && data.url) {
      if (img.getAttribute('src') !== data.url) {
        img.classList.remove('is-loaded');
        img.onload = () => { img.classList.add('is-loaded'); slot.classList.add('has-image'); };
        img.src = data.url;
      }
      creditEl.textContent = 'Wikimedia Commons';
      creditEl.href = data.page || '#';
      creditEl.classList.add('is-visible');
    } else {
      img.removeAttribute('src');
      img.classList.remove('is-loaded');
      slot.classList.remove('has-image');
      creditEl.classList.remove('is-visible');
    }
  }

  function renderImages() {
    if (!state.result) return;
    setSlotImage(els.heroSlot, els.heroImg, els.heroCredit, state.result.dest.city);
    state.result.alts.forEach((a, i) => {
      const card = els.altsGrid.children[i];
      if (!card) return;
      setSlotImage(card.querySelector('.tai-image-slot'), card.querySelector('.tai-slot-img'), card.querySelector('.tai-slot-credit'), a.city);
    });
  }

  // ---------- flow actions ----------

  function goMap() {
    if (state.phase === 'intro') setState({ phase: 'map' });
  }

  function startQuiz() {
    setState({ mapOut: true });
    if (flightTimer) { flightTimer.stop(); flightTimer = null; }
    after(rm ? 60 : 1050, () => setState({ phase: 'quiz', mapOut: false, qi: 0, answers: [], picked: null, hover: null }));
  }

  function pick(opt) {
    if (state.picked) return;
    const answers = state.answers.slice(0, state.qi);
    answers.push(opt);
    setState({ answers, picked: opt.label });
    after(rm ? 60 : 480, () => {
      if (state.qi + 1 < QUESTIONS.length) setState({ qi: state.qi + 1, picked: null, hover: null });
      else finish();
    });
  }

  function back() {
    if (state.qi > 0) setState({ qi: state.qi - 1, picked: null, hover: null });
  }

  function finish() {
    const t = topType(state.answers);
    const u = TYPES[t].vec;
    const g = (state.answers.find((a) => a.gender !== undefined) || {}).gender;
    const scored = DESTS.map((d) => {
      let dist = 0;
      AXES.forEach((k) => { dist += W[k] * Math.abs(u[k] - d.a[k]); });
      dist -= genderBias(g, d);
      return { d, dist: Math.max(0, dist) };
    }).sort((a, b) => a.dist - b.dist);
    ranked = scored.map((s) => s.d);
    const best = scored[0];
    const match = clampNum(74, 96, Math.round(97 - best.dist * 11));
    const reasons = TYPES[t].reasons;
    const alts = ranked.slice(1, 4);
    fetchImgs([best.d].concat(alts));
    setState({ phase: 'analyze', step: 0, result: { dest: best.d, match, reasons, alts, type: t, counts: typeCounts(state.answers) } });
    const gap = rm ? 500 : 1550;
    after(120, () => setState({ step: 1 }));
    after(gap, () => setState({ step: 2 }));
    after(gap * 2, () => setState({ step: 3 }));
    after(gap * 2 + (rm ? 400 : 1250), () => setState({ phase: 'result' }));
  }

  function restart() {
    if (flightTimer) { flightTimer.stop(); flightTimer = null; }
    setState({ phase: 'map', qi: 0, answers: [], picked: null, result: null, hover: null, step: 0 });
  }

  // ---------- render ----------

  function replay(el, anim) {
    if (!el) return;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = anim;
  }

  function renderOptions(q) {
    els.optionsList.innerHTML = '';
    els.optionsList.classList.toggle('tai-kw-grid', !!q.grid);
    els.optionsList.style.flexDirection = q.grid ? '' : 'column';
    els.optionButtons = q.options.map((o, i) => {
      const btn = document.createElement('button');
      btn.className = 'tai-option';
      btn.innerHTML = '<span class="tai-option-num">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span class="tai-option-label"></span>' +
        '<span class="tai-option-arrow">→</span>';
      btn.querySelector('.tai-option-label').textContent = o.label;
      btn.addEventListener('click', () => pick(o));
      btn.addEventListener('mouseenter', () => setState({ hover: o.label, mood: o.mood }));
      btn.addEventListener('mouseleave', () => setState({ hover: null }));
      els.optionsList.appendChild(btn);
      return btn;
    });
    updateOptionStates(q);
  }

  function updateOptionStates(q) {
    if (!els.optionButtons) return;
    q.options.forEach((o, i) => {
      const btn = els.optionButtons[i];
      if (!btn) return;
      const active = state.hover === o.label;
      const chosen = state.picked === o.label;
      const dimmed = state.picked && !chosen;
      btn.style.background = (active || chosen) ? 'rgba(190,225,255,.07)' : 'transparent';
      btn.style.color = (active || chosen) ? '#ffffff' : 'rgba(255,255,255,.72)';
      btn.style.transform = 'scale(' + (chosen ? '1.035' : '1') + ')';
      btn.style.opacity = dimmed ? '.22' : '1';
      btn.querySelector('.tai-option-arrow').style.opacity = (active || chosen) ? '1' : '0';
    });
  }

  // 높은 성향 2개, 낮은 성향 2개를 막대로 그립니다. 막대 아래에는 번호만 작게 표시합니다.
  // 점수 = 고른 횟수 / 그 유형이 나올 수 있는 최대 횟수(TYPE_MAX).
  function renderChart(counts, top) {
    const ids = Object.keys(counts).map(Number);
    const shuffle = (arr) => arr.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((x) => x[1]);
    const desc = shuffle(ids.filter((i) => i !== top)).sort((x, y) => counts[y] - counts[x]);
    const bars = [top, desc[0], desc[desc.length - 2], desc[desc.length - 1]];
    const H = 150;
    els.typeChart.innerHTML = '';
    els.typeChart.setAttribute('aria-label', '높은 성향 2개와 낮은 성향 2개 그래프');
    bars.forEach((id, i) => {
      const pct = counts[id] / TYPE_MAX[id];
      const high = i < 2;
      const col = document.createElement('div');
      col.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:10px';
      const track = document.createElement('div');
      track.style.cssText = 'position:relative;width:100%;max-width:44px;height:' + H + 'px;border-radius:6px;background:rgba(255,255,255,.04);overflow:hidden';
      const fill = document.createElement('div');
      fill.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:0;border-radius:6px;transition:height 1200ms cubic-bezier(.2,.8,.2,1) ' + (300 + i * 140) + 'ms;' +
        (high ? 'background:linear-gradient(to top,rgba(150,200,255,.55),#eaf6ff);box-shadow:0 0 18px rgba(150,205,255,.55)'
              : 'background:rgba(190,225,255,.22)');
      track.appendChild(fill);
      const num = document.createElement('div');
      num.textContent = id;
      num.style.cssText = "font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:" + (high ? 'rgba(234,246,255,.75)' : 'rgba(255,255,255,.32)');
      col.appendChild(track);
      col.appendChild(num);
      els.typeChart.appendChild(col);
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.height = Math.max(pct * 100, 3) + '%'; }));
    });
  }

  function renderResult(r) {
    const d = r.dest;
    const ty = TYPES[r.type];
    renderChart(r.counts, r.type);
    els.typeName.textContent = ty.name;
    els.typeDesc.textContent = ty.desc;
    els.cityUpper.textContent = d.city.toUpperCase();
    els.cityCountry.textContent = d.city + ', ' + d.country;
    els.matchPct.textContent = r.match + '%';
    els.destTagline.textContent = d.tagline;
    els.ctaSub.textContent = d.ko + '에서의 며칠을 상상해 보세요.';
    els.heroSlotHint.textContent = d.hint;

    setSlotImage(els.heroSlot, els.heroImg, els.heroCredit, d.city);

    els.reasonsList.innerHTML = '';
    r.reasons.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'tai-reason';
      row.innerHTML = '<span class="tai-reason-num">' + String(i + 1).padStart(2, '0') + '</span><span class="tai-reason-text"></span>';
      row.querySelector('.tai-reason-text').textContent = t;
      els.reasonsList.appendChild(row);
    });

    els.altsGrid.innerHTML = '';
    r.alts.forEach((a) => {
      const card = document.createElement('div');
      card.className = 'tai-alt-card';
      card.innerHTML =
        '<div class="tai-alt-imgwrap tai-image-slot">' +
          '<div class="tai-slot-placeholder"><span></span></div>' +
          '<img class="tai-slot-img" alt="">' +
          '<a class="tai-slot-credit" target="_blank" rel="noopener"></a>' +
        '</div>' +
        '<div>' +
          '<div class="tai-alt-city"></div>' +
          '<div class="tai-alt-meta"></div>' +
          '<div class="tai-alt-tagline"></div>' +
        '</div>';
      card.querySelector('.tai-slot-placeholder span').textContent = a.hint;
      card.querySelector('.tai-alt-city').textContent = a.city;
      card.querySelector('.tai-alt-meta').textContent = a.country.toUpperCase();
      card.querySelector('.tai-alt-tagline').textContent = a.tagline;
      els.altsGrid.appendChild(card);
      setSlotImage(card.querySelector('.tai-image-slot'), card.querySelector('.tai-slot-img'), card.querySelector('.tai-slot-credit'), a.city);
    });
  }

  const PHASE_ELS = { intro: 'phaseIntro', map: 'phaseMap', quiz: 'phaseQuiz', analyze: 'phaseAnalyze', result: 'phaseResult' };
  const PHASE_DISPLAY = { intro: 'flex', map: 'flex', quiz: 'flex', analyze: 'flex', result: 'block' };
  const ANALYZE_MSGS = ['', '당신의 성향 유형을 살펴보고 있어요.', '유형에 어울리는 여행지를 찾고 있어요.', '여행지가 결정되었습니다.'];

  function render() {
    const s = state;
    const small = s.phase !== 'intro';

    els.logo.style.top = small ? 'clamp(46px,7vh,74px)' : '46%';
    const logoScale = small ? (s.phase === 'result' ? 0 : 0.34) : 1;
    els.logo.style.transform = 'translate(-50%,-50%) scale(' + logoScale + ')';
    els.logo.style.opacity = s.intro >= 1 ? (s.phase === 'result' ? '0' : '1') : '0';

    els.tagline.style.opacity = s.intro >= 2 ? '1' : '0';
    els.tagline.style.filter = s.intro >= 2 ? 'blur(0px)' : 'blur(10px)';
    els.hintWrap.style.opacity = s.intro >= 3 ? '1' : '0';

    const moodKey = s.hover ? s.mood : null;
    els.moodLayer.style.background = MOODS[moodKey] || MOODS.city;
    els.moodLayer.style.opacity = moodKey ? '1' : '0';

    els.heroMap.style.transform = 'scale(' + (s.mapOut ? '0.62' : '1') + ') translateY(' + (s.mapOut ? '-4%' : '0%') + ')';
    els.heroMap.style.opacity = s.mapOut ? '0' : '1';
    els.mapUi.style.opacity = s.mapOut ? '0' : '1';

    Object.keys(PHASE_ELS).forEach((key) => {
      els[PHASE_ELS[key]].style.display = (s.phase === key) ? PHASE_DISPLAY[key] : 'none';
    });

    if (s.phase === 'map' && lastPhase !== 'map') {
      replay(els.mapQ, 'tai-in 1400ms 300ms both');
      replay(els.startQuizBtn, 'tai-in 1400ms 2200ms both');
      if (geo) drawHero(els.heroMap);
    }

    const q = QUESTIONS[s.qi] || QUESTIONS[0];
    els.progressFill.style.width = Math.round(((s.qi + (s.picked ? 1 : 0)) / QUESTIONS.length) * 100) + '%';
    els.progressLabel.textContent = (s.qi + 1) + ' / ' + QUESTIONS.length;
    els.backBtn.style.opacity = s.qi > 0 ? '1' : '0';

    if (s.phase === 'quiz' && (lastQi !== s.qi || lastPhase !== 'quiz')) {
      els.qKicker.textContent = q.kicker;
      els.qTitle.textContent = q.title;
      renderOptions(q);
      replay(els.qBlock, 'tai-in 900ms both');
      lastQi = s.qi;
    } else if (s.phase === 'quiz') {
      updateOptionStates(q);
    }

    els.analyzeFill.style.width = Math.round((s.step / 3) * 100) + '%';
    if (s.phase === 'analyze' && (lastStep !== s.step || lastPhase !== 'analyze')) {
      els.analyzeMsg.textContent = ANALYZE_MSGS[s.step] || '';
      replay(els.analyzeMsg, 'tai-in-soft 900ms both');
      lastStep = s.step;
    }
    if (s.phase === 'analyze' && lastPhase !== 'analyze' && geo) {
      drawAnalyze(els.analyzeMap);
    }

    if (s.result && s.result !== lastResult) {
      renderResult(s.result);
      lastResult = s.result;
    }

    lastPhase = s.phase;
  }

  // ---------- boot ----------

  function cacheEls() {
    ['root', 'logo', 'moodLayer', 'phaseIntro', 'phaseMap', 'phaseQuiz', 'phaseAnalyze', 'phaseResult',
      'tagline', 'hintWrap', 'beginBtn', 'heroMap', 'mapUi', 'mapQ', 'startQuizBtn',
      'progressFill', 'progressLabel', 'qBlock', 'qKicker', 'qTitle', 'optionsList', 'backBtn',
      'analyzeMap', 'analyzeMsg', 'analyzeFill',
      'heroSlot', 'heroSlotHint', 'heroImg', 'heroCredit', 'cityUpper', 'cityCountry', 'matchPct',
      'destTagline', 'reasonsList', 'typeName', 'typeDesc', 'typeChart', 'altsGrid', 'ctaSub', 'restartBtn'
    ].forEach((id) => { els[id] = $(id); });
  }

  function init() {
    cacheEls();

    els.beginBtn.addEventListener('click', goMap);
    els.startQuizBtn.addEventListener('click', startQuiz);
    els.backBtn.addEventListener('click', back);
    els.restartBtn.addEventListener('click', restart);

    rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    loadGeo();
    after(600, () => setState({ intro: 1 }));
    after(2000, () => setState({ intro: 2 }));
    after(3600, () => setState({ intro: 3 }));
    after(rm ? 2600 : 6200, () => goMap());

    const skip = () => { if (state.phase === 'intro' && state.intro >= 1) goMap(); };
    window.addEventListener('wheel', skip, { passive: true });
    window.addEventListener('touchstart', skip, { passive: true });
    window.addEventListener('keydown', skip);

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (state.phase === 'map' && geo) drawHero(els.heroMap);
        if (state.phase === 'analyze' && geo) drawAnalyze(els.analyzeMap);
      }, 260);
    });

    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
