<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맞춤 여행지 찾기 · Trip Dart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --sea:#DCE7EC; --land:#FFFFFF; --border:#A9B1B6; --accent:#E4572E; --accent-dark:#A63A17; --navy:#1F3A5F; --ink:#16202A; --muted:#5B6772; --line:#C3CCD2; --cream:#FBF4EF; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--sea); font-family: 'Noto Sans KR', system-ui, sans-serif; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 28px 24px; box-shadow: 0 24px 60px rgba(16,24,32,.18); display: flex; flex-direction: column; gap: 20px; }
  .view { display: flex; flex-direction: column; gap: 20px; animation: popIn .4s cubic-bezier(.2,1.3,.4,1) both; }
  [hidden] { display: none !important; }
  .kicker { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
  h1 { margin: 0; font-size: 30px; line-height: 1.25; font-weight: 900; letter-spacing: -.02em; }
  h2 { margin: 0; font-size: 22px; line-height: 1.4; font-weight: 700; letter-spacing: -.01em; }
  .lead { margin: 0; font-size: 15px; line-height: 1.7; color: var(--muted); }
  .progress { display: flex; align-items: center; gap: 12px; }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: #EEF2F3; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); font: 500 16px 'Noto Sans KR', system-ui, sans-serif; text-align: left; cursor: pointer; transition: background .15s, border-color .15s; }
  .opt:hover { background: #F6F8F9; border-color: var(--navy); }
  .opt.picked { background: var(--navy); border-color: var(--navy); color: #fff; }
  .opt .num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--sea); color: var(--navy); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .opt.picked .num { background: #fff; }
  .row { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border: 0; border-radius: 14px; background: var(--navy); color: #fff; font: 700 18px 'Noto Sans KR', system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  .btn:hover { background: #0F2440; }
  .btn.accent { background: var(--accent); }
  .btn.accent:hover { background: var(--accent-dark); }
  .ghost { display: flex; align-items: center; justify-content: center; height: 48px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: #2B3640; font: 500 16px 'Noto Sans KR', system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  .ghost:hover { background: #EEF2F3; }
  .back { align-self: flex-start; height: 40px; padding: 0 4px; border: 0; background: none; color: var(--muted); font: 500 14px 'Noto Sans KR', system-ui, sans-serif; cursor: pointer; }
  .back:disabled { visibility: hidden; }
  .cutout { height: 220px; border-radius: 16px; background: var(--cream); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .cutout svg { width: 100%; height: 100%; overflow: visible; }
  .names { display: flex; flex-direction: column; gap: 4px; text-align: center; }
  .names p { margin: 0; font-size: 14px; color: var(--muted); }
  .names h2 { font-size: 34px; line-height: 1.2; font-weight: 900; letter-spacing: -.02em; }
  .names .tag { margin-top: 6px; font-size: 15px; color: var(--ink); }
  .section-title { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .reasons { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .reasons li { display: flex; gap: 10px; font-size: 15px; line-height: 1.6; }
  .reasons li::before { content: ''; flex: none; width: 6px; height: 6px; margin-top: 10px; border-radius: 50%; background: var(--accent); }
  .alts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .alt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border: 1px solid #E3E8EB; border-radius: 12px; background: #fff; cursor: pointer; font: inherit; color: inherit; }
  .alt:hover { border-color: var(--navy); }
  .alt svg { width: 56px; height: 56px; overflow: visible; }
  .alt b { font-size: 14px; font-weight: 700; }
  .alt span { font-size: 11px; color: var(--muted); }
  .loading { text-align: center; font-size: 15px; color: #3B4F63; }
  .opt:focus-visible, .btn:focus-visible, .ghost:focus-visible, .alt:focus-visible, .back:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @keyframes popIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>
<body>
<main class="card">
  <section class="view" id="introView">
    <p class="kicker">TRIP DART · 맞춤 여행지 찾기</p>
    <h1>나에게 맞는<br>국내 여행지는 어디일까?</h1>
    <p class="lead">질문 6개에 답하면 다트 지도 속 시·군 가운데 당신의 여행 성향에 맞는 곳을 골라 드려요.</p>
    <button class="btn accent" id="startBtn">검사 시작하기</button>
    <a class="ghost" href="./">다트 던지러 가기</a>
  </section>

  <section class="view" id="quizView" hidden>
    <div class="progress"><div class="bar"><i id="bar"></i></div><span class="count" id="count"></span></div>
    <p class="kicker" id="qKicker"></p>
    <h2 id="qTitle"></h2>
    <div class="options" id="options"></div>
    <button class="back" id="backBtn">← 이전 질문</button>
  </section>

  <section class="view" id="resultView" hidden>
    <div class="cutout"><svg id="cutout" role="img"><path id="cutShadow" fill="#000" opacity=".12"/><path id="cutShape" fill="#E4572E" stroke="#A63A17" stroke-linejoin="round"/></svg></div>
    <div class="names"><p id="rSub"></p><h2 id="rTitle"></h2><p class="tag" id="rTag"></p></div>
    <div><p class="section-title">이런 성향이라서 골랐어요</p><ul class="reasons" id="reasons"></ul></div>
    <div><p class="section-title">이런 곳도 잘 맞아요</p><div class="alts" id="alts"></div></div>
    <button class="btn accent" id="retryBtn">다시 검사하기</button>
    <a class="ghost" href="./">다트 던지러 가기</a>
  </section>

  <p class="loading" id="loading" hidden>지도를 불러오는 중…</p>
</main>

    { p: '경상남도', n: '거제시', tag: '바람의 언덕과 외도 보타니아', a: { nature: .75, sea: .95, food: .55, active: .55, city: .2, history: .15, far: .85 } },
    { p: '경상남도', n: '남해군', tag: '다랭이마을과 독일마을', a: { nature: .85, sea: .85, food: .5, active: .35, city: 0, history: .35, far: .85 } },
    { p: '대구광역시', n: '대구', tag: '근대골목과 막창, 서문시장', a: { nature: .15, sea: 0, food: .85, active: .4, city: .85, history: .55, far: .6 } },
    { p: '대전광역시', n: '대전', tag: '빵 하나 사러 가는 도시', a: { nature: .2, sea: 0, food: .85, active: .3, city: .75, history: .2, far: .35 } },
    { p: '제주특별자치도', n: '제주시', tag: '함덕·협재 해변과 동문시장', a: { nature: .8, sea: .95, food: .75, active: .6, city: .35, history: .25, far: .95 } },
    { p: '제주특별자치도', n: '서귀포시', tag: '성산일출봉과 올레길, 헬로키티아일랜드', a: { nature: .9, sea: .95, food: .65, active: .7, city: .2, history: .25, far: .95 } }
  ];

  // ---------- 성별 보정 ----------
  // 여성: 캐릭터 테마파크·캐릭터 숍이 있는 곳(CUTE)을, 남성: 액티비티 점수(a.active)가 높은 곳을 위로 올립니다.
  // 점수와 가중치는 임시값입니다. 설문 데이터가 생기면 조정하세요.
  const CUTE = {
    '경기도/용인시': 1,          // 에버랜드
    '서울특별시/서울': .9,        // 롯데월드, 캐릭터 플래그십 스토어
    '강원특별자치도/춘천시': .8,  // 레고랜드 코리아
    '부산광역시/기장군': .8,      // 롯데월드 어드벤처 부산
    '제주특별자치도/서귀포시': .7 // 헬로키티아일랜드
  };
  const GENDER_W = { f: .8, m: 1.2 };
  const genderBias = (g, d) => g === 'f' ? GENDER_W.f * (CUTE[d.p + '/' + d.n] || 0)
    : g === 'm' ? GENDER_W.m * Math.max(0, d.a.active - .5) * 2 : 0;

  const AXES = ['nature', 'sea', 'food', 'active', 'city', 'history', 'far'];
  const W = { nature: 1.2, sea: 1.3, food: 1.1, active: 1.1, city: 1.1, history: 1, far: .8 };

  const $ = (id) => document.getElementById(id);
  const views = ['introView', 'quizView', 'resultView'];
  let regions = null, qi = 0, answers = [], locked = false;

  const show = (id) => views.forEach((v) => { $(v).hidden = v !== id; });
  const isMetro = (r) => !/[시군]$/.test(r.n);
  const regionOf = (d) => regions.find((r) => r.p === d.p && r.n === d.n);

  function drawShape(svg, shape, shadow, r) {
    const [x0, y0, x1, y1] = r.b, bw = x1 - x0, bh = y1 - y0, size = Math.max(bw, bh), pad = size * .08;
    svg.setAttribute('viewBox', `${x0 - pad} ${y0 - pad} ${bw + pad * 2} ${bh + pad * 2}`);
    shape.setAttribute('d', r.d);
    shape.setAttribute('stroke-width', (size / 160).toFixed(2));
    if (shadow) {
      shadow.setAttribute('d', r.d);
      shadow.setAttribute('transform', `translate(${(size * .012).toFixed(2)} ${(size * .02).toFixed(2)})`);
    }
  }

  function renderQuestion() {
    const q = QUESTIONS[qi];
    $('bar').style.width = (qi / QUESTIONS.length * 100) + '%';
    $('count').textContent = (qi + 1) + ' / ' + QUESTIONS.length;
    $('qKicker').textContent = q.kicker;
    $('qTitle').textContent = q.title;
    $('backBtn').disabled = qi === 0;
    const box = $('options');
    box.innerHTML = '';
    q.options.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<span class="num"></span><span></span>';
      b.children[0].textContent = i + 1;
      b.children[1].textContent = o.label;
      b.addEventListener('click', () => pick(o, b));
      box.appendChild(b);
    });
    const v = $('quizView'); v.style.animation = 'none'; void v.offsetWidth; v.style.animation = '';
  }

  function pick(o, btn) {
    if (locked) return;
    locked = true;
    btn.classList.add('picked');
    answers = answers.slice(0, qi);
    answers.push(o);
    $('bar').style.width = ((qi + 1) / QUESTIONS.length * 100) + '%';
    setTimeout(() => {
      locked = false;
      if (qi + 1 < QUESTIONS.length) { qi++; renderQuestion(); } else finish();
    }, 320);
  }

  function finish() {
    const u = {};
    AXES.forEach((k) => {
      const vals = answers.map((a) => a.vec[k]).filter((v) => v !== undefined);
      u[k] = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : .5;
    });
    const g = answers[0] && answers[0].gender;
    const ranked = DESTS.map((d) => {
      let dist = 0;
      AXES.forEach((k) => { dist += W[k] * Math.abs(u[k] - d.a[k]); });
      return { d, dist: dist - genderBias(g, d) };
    }).sort((a, b) => a.dist - b.dist).map((s) => s.d);
    const reasons = [];
    answers.forEach((a) => { if (a.reason && reasons.length < 3 && !reasons.includes(a.reason)) reasons.push(a.reason); });
    renderResult(ranked[0], ranked.slice(1, 4), reasons);
  }

  function renderResult(best, alts, reasons) {
    const r = regionOf(best);
    drawShape($('cutout'), $('cutShape'), $('cutShadow'), r);
    const title = isMetro(r) ? r.p : r.n;
    $('cutout').setAttribute('aria-label', title + ' 지역 모양');
    $('rTitle').textContent = title;
    $('rSub').textContent = isMetro(r) ? '대한민국' : r.p;
    $('rTag').textContent = best.tag;
    if (reasons) {
      const ul = $('reasons'); ul.innerHTML = '';
      reasons.forEach((t) => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
    }
    const box = $('alts'); box.innerHTML = '';
    alts.forEach((d) => {
      const ar = regionOf(d);
      const b = document.createElement('button');
      b.className = 'alt';
      b.innerHTML = '<svg aria-hidden="true"><path fill="#1F3A5F" stroke="#16202A" stroke-linejoin="round"/></svg><b></b><span></span>';
      drawShape(b.querySelector('svg'), b.querySelector('path'), null, ar);
      b.querySelector('b').textContent = isMetro(ar) ? ar.p.replace(/(특별시|광역시|특별자치시)$/, '') : ar.n;
      b.querySelector('span').textContent = isMetro(ar) ? '대한민국' : ar.p.replace('특별자치도', '');
      b.setAttribute('aria-label', b.querySelector('b').textContent + ' 결과 보기');
      b.addEventListener('click', () => renderResult(d, alts.filter((x) => x !== d).concat(best), null));
      box.appendChild(b);
    });
    show('resultView');
    window.scrollTo(0, 0);
  }

  function start() {
    qi = 0; answers = [];
    if (regions) { show('quizView'); renderQuestion(); return; }
    $('introView').hidden = true; $('loading').hidden = false;
    fetch('regions.json').then((res) => res.json()).then((d) => {
      regions = d.regions;
      $('loading').hidden = true;
      show('quizView'); renderQuestion();
    }).catch(() => { $('loading').textContent = '지도를 불러오지 못했어요. 새로고침해 주세요.'; });
  }

  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);
  $('backBtn').addEventListener('click', () => { if (qi > 0 && !locked) { qi--; renderQuestion(); } });
})();
</script>
</body>
</html>
